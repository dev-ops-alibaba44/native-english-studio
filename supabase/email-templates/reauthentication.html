<!--
  Supabase Dashboard → Authentication → Email Templates → Reauthentication
  → paste into "Message body". Suggested Subject (see README): 您的驗證碼 - Native English Studio

  Reauthentication is Supabase's step-up check before a sensitive
  operation on an already-logged-in account — there's no link to click,
  only a short-lived code ({{ .Token }}) typed back into the app, so this
  template leads with the code rather than a button.
-->
<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#FAF8F5; font-family:Georgia, 'Times New Roman', serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF8F5; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#FFFFFF; border:1px solid #E5E0D8; border-radius:6px; overflow:hidden;">

            <tr>
              <td align="center" style="background-color:#FAF8F5; padding:32px 24px 24px;">
                <img src="https://nativeenglish.ca/logo.png" width="160" alt="Native English" style="display:block; width:160px; height:auto; border:0;" />
              </td>
            </tr>

            <tr>
              <td style="padding:32px 32px 8px;">
                <p style="margin:0 0 4px; font-size:18px; font-weight:bold; color:#172983;">
                  請輸入驗證碼以繼續
                </p>
                <p style="margin:0 0 24px; font-size:13px; color:#6B7280;">
                  Native English Studio
                </p>
                <p style="margin:0 0 24px; font-size:14px; line-height:1.7; color:#1F2937;">
                  您好，為了保護您的帳號安全，請在畫面中輸入下方驗證碼以繼續這項操作。
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:0 32px 32px;">
                <p style="margin:0 0 8px; font-size:12px; color:#6B7280;">您的驗證碼：</p>
                <p style="margin:0; font-size:28px; font-weight:bold; letter-spacing:4px; color:#172983; font-family:'Courier New', monospace;">
                  {{ .Token }}
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:0 32px 32px;">
                <p style="margin:0; font-size:12px; line-height:1.6; color:#9CA3AF;">
                  如果您並未嘗試進行此操作，請直接忽略這封信件，並建議您盡快至帳號設定變更密碼。此驗證碼有時效性，如已過期請重新操作。
                </p>
              </td>
            </tr>

            <tr>
              <td style="background-color:#FAF8F5; padding:20px 32px; border-top:1px solid #E5E0D8;">
                <p style="margin:0; font-size:11px; color:#9CA3AF; text-align:center;">
                  Native English Studio · info@nativeenglish.ca
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
