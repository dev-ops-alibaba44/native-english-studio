<!--
  Batch 24: branded replacement for Supabase's default "Invite user"
  email (the plain, unbranded "You've been invited" template Dan flagged
  as unprofessional-looking).

  This file is NOT deployed by the app — Supabase Auth emails are
  rendered from a template stored in the Supabase Dashboard, not from
  anything in this repo. To apply it:

    Supabase Dashboard → Authentication → Email Templates → Invite user
    → paste this file's contents into the "Message body" field → Save.

  Supabase template variables used below ({{ .ConfirmationURL }}) are
  filled in by Supabase itself at send time — leave them exactly as
  written. Table-based layout and inline styles throughout because email
  clients (Gmail, Outlook, Apple Mail) strip <style> blocks and modern
  CSS unpredictably; this is the standard, safe way to build HTML email.
-->
<!DOCTYPE html>
<html>
  <body style="margin:0; padding:0; background-color:#FAF8F5; font-family:Georgia, 'Times New Roman', serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF8F5; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background-color:#FFFFFF; border:1px solid #E5E0D8; border-radius:6px; overflow:hidden;">

            <!-- Logo -->
            <tr>
              <td align="center" style="background-color:#FAF8F5; padding:32px 24px 24px;">
                <img
                  src="https://nativeenglish.ca/logo.png"
                  width="160"
                  alt="Native English"
                  style="display:block; width:160px; height:auto; border:0;"
                />
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:32px 32px 8px;">
                <p style="margin:0 0 4px; font-size:18px; font-weight:bold; color:#172983;">
                  您的機構已經為您建立帳號
                </p>
                <p style="margin:0 0 24px; font-size:13px; color:#6B7280;">
                  Native English Studio
                </p>
                <p style="margin:0 0 24px; font-size:14px; line-height:1.7; color:#1F2937;">
                  您好，您所屬的機構已經在 Native English Studio 為您建立了學生帳號。請點選下方按鈕，設定您的登入密碼，即可開始使用。
                </p>
              </td>
            </tr>

            <!-- CTA button -->
            <tr>
              <td align="center" style="padding:0 32px 32px;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:inline-block; background-color:#172983; color:#FFFFFF; text-decoration:none; font-size:14px; font-weight:bold; padding:12px 32px; border-radius:4px;"
                >
                  設定密碼並登入
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding:0 32px 32px;">
                <p style="margin:0; font-size:12px; line-height:1.6; color:#9CA3AF;">
                  如果您並未預期收到這封信，或這不是您的電子郵件地址，請直接忽略這封信件。此連結有時效性，如已過期請聯絡您的機構顧問，請他們為您重新寄送邀請信。
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td style="background-color:#FAF8F5; padding:20px 32px; border-top:1px solid #E5E0D8;">
                <p style="margin:0; font-size:11px; color:#9CA3AF; text-align:center;">
                  Native English Studio · info@nativeenglish.ca
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
